# The suite on every push and pull request.
#
# This repo is the library; the site that draws with it builds and deploys
# from its own repo. What the library owes is a green suite and a clean tsc.
#
# It needs no artifacts and no sibling checkouts: the corpus is baked into
# src/data/ and committed, and the only dependencies are devDependencies from
# the registry. A clean clone runs everything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `test` builds first (tsc, strict, the same check `tsc --noEmit` makes)
      # and the suite imports from dist/, so a type error or a broken emit
      # fails here before a test can run.
      - run: npm test
