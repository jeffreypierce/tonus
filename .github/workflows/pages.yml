# The site, built and deployed on every push to main.
#
# `docs/dist/` is the built library the page imports, and it is gitignored —
# so it cannot reach GitHub by being committed. This builds it here instead:
# the published site is always what `npm run site` produces from the source at
# that commit, and there is no step a human can forget.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The suite builds first and imports from dist/, so a broken build or a
      # red test stops the deploy rather than publishing a site that lies.
      - run: npm test
      - run: npm run site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
